services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: enterpriseiq-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterpriseiq-network

  redis:
    image: redis:7-alpine
    container_name: enterpriseiq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterpriseiq-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: enterpriseiq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
      - EMBEDDING_PROVIDER=sentence_transformers
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - RERANKER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - ANSWER_GENERATOR_TYPE=mock
      - LANGSMITH_TRACING=false
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - enterpriseiq-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: enterpriseiq-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - enterpriseiq-network

volumes:
  qdrant_data:
    driver: local
  redis_data:
    driver: local

networks:
  enterpriseiq-network:
    driver: bridge
